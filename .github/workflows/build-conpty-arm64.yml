name: Build ConPTY ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      
    - name: Restore NuGet packages
      run: nuget restore OpenConsole.slnx
      
    - name: Build ConPTY for ARM64
      shell: pwsh
      run: |
        $solutionDir = (Get-Location).Path + "\"
        # Build the winconpty lib first, then the dll
        msbuild src\winconpty\lib\winconptylib.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:SolutionDir=$solutionDir
        msbuild src\winconpty\dll\winconptydll.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:SolutionDir=$solutionDir
        
    - name: Find and collect artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        Write-Host "=== Searching for conpty files ==="
        Get-ChildItem -Recurse -Include "conpty.dll","conpty.lib","OpenConsole.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "ARM64" -and $_.FullName -match "Release" } | ForEach-Object {
          Write-Host "Found: $($_.FullName)"
          Copy-Item $_.FullName -Destination artifacts/ -Force
        }
        Write-Host "=== Artifacts collected ==="
        Get-ChildItem artifacts/
        
    - name: Upload ConPTY ARM64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: conpty-arm64
        path: artifacts/
        if-no-files-found: warn
