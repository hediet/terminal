name: Build ConPTY ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      
    - name: Restore NuGet packages
      run: nuget restore OpenConsole.slnx
      
    - name: Setup VS Developer Environment for ARM64 cross-compile
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64_arm64
        
    - name: Build ConPTY for ARM64
      shell: cmd
      run: |
        msbuild src\winconpty\lib\winconptylibrary.vcxproj /p:Configuration=Release /p:Platform=ARM64 /t:Build
        msbuild src\winconpty\dll\winconptydll.vcxproj /p:Configuration=Release /p:Platform=ARM64 /t:Build
      
    - name: Find and collect artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        Write-Host "=== Searching for conpty files ==="
        Get-ChildItem -Recurse -Include "conpty.dll","conpty.lib" -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "Found: $($_.FullName)"
          Copy-Item $_.FullName -Destination artifacts/ -Force
        }
        Write-Host "=== Artifacts collected ==="
        Get-ChildItem artifacts/
        
    - name: Upload ConPTY ARM64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: conpty-arm64
        path: artifacts/
        if-no-files-found: warn
